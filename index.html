<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Palavra — Europees Portugees</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123147">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palavra">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16273A;
    --azulejo:#2B5C7E;
    --azulejo-deep:#123147;
    --paper:#FBF9F3;
    --paper-dim:#F1ECDF;
    --gold:#3F8F5F;
    --coral:#BE4438;
    --sage:#4C7A5B;
    --line: rgba(22,39,58,0.12);
    --radius: 14px;
    --shadow: 0 10px 30px rgba(18,49,71,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: var(--paper);
    box-shadow: var(--shadow);
  }

  /* ---- Header: azulejo tile band ---- */
  .header{
    position:relative;
    background-color: var(--azulejo-deep);
    padding: 22px 20px 18px;
    color: var(--paper);
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
  }
  .brand-mark{
    width:24px;height:24px;border-radius:6px;
    display:inline-block;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.4);
    object-fit:cover;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 21px;
    letter-spacing: 0.2px;
    margin:0;
  }
  .icon-btn{
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.28);
    color: var(--paper);
    width:36px;height:36px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
  }
  .icon-btn:active{ transform: scale(0.95); }

  .lang-picker{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:16px;
  }
  .lang-dropdown{
    position:relative;
  }
  .flag-toggle{
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 12px;
    width:52px;
    height:44px;
    font-size:22px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .flag-toggle:active{ transform: scale(0.95); }
  .flag-icon{
    display:inline-flex;
    width:26px;
    height:18px;
    border-radius:3px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    flex-shrink:0;
    vertical-align:middle;
  }
  .flag-icon svg{
    width:100%;
    height:100%;
    display:block;
  }
  .lang-menu-item{ align-items:center; }
  .lang-menu{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:50%;
    transform: translateX(-50%);
    background: white;
    border-radius: 10px;
    box-shadow: var(--shadow);
    min-width:170px;
    overflow:hidden;
    z-index:30;
  }
  .lang-menu.open{ display:block; }
  .lang-menu.align-right{
    left:auto;
    right:0;
    transform:none;
  }
  .lang-menu-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 10px 14px;
    font-size:14px;
    font-weight:500;
    color: var(--ink);
    cursor:pointer;
  }
  .lang-menu-item:hover{ background: var(--paper-dim); }
  .lang-menu-item.selected{
    background: rgba(43,92,126,0.1);
    font-weight:700;
    color: var(--azulejo-deep);
  }
  .swap-btn{
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.28);
    color: var(--paper);
    width:34px; height:34px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .swap-btn:active{ transform: scale(0.92) rotate(180deg); }
  .pkg-label{
    font-size:12.5px;
    color: rgba(255,255,255,0.7);
    margin-top:12px;
    font-weight:500;
  }
  .package-view{
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .package-card{
    background:white;
    border:1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor:pointer;
    transition: border-color .12s ease, transform .06s ease;
  }
  .package-card:active{ transform: scale(0.99); }
  .package-card.active{
    border-color: var(--azulejo);
    background: rgba(43,92,126,0.05);
  }
  .package-card-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    color: var(--ink);
  }
  .package-card-desc{
    font-size:13px;
    color: rgba(22,39,58,0.55);
    margin-top:4px;
  }
  .package-card-progress{
    font-size:12.5px;
    font-weight:600;
    color: var(--azulejo);
    font-family:'JetBrains Mono', monospace;
    margin-top:8px;
  }
  .package-card-tag{
    display:inline-block;
    margin-top:10px;
    font-size:11.5px;
    font-weight:600;
    color: var(--sage);
    background: rgba(76,122,91,0.12);
    padding:4px 10px;
    border-radius:999px;
  }
  .package-card-btn{
    margin-top:12px;
    background: var(--azulejo-deep);
    color: var(--paper);
    border:none;
    padding: 9px 16px;
    border-radius: 999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }

  /* ---- Placeholder solid colors per word package (swap for real artwork later) ---- */
  .tile-pattern-basis{ background-color: var(--azulejo); }
  .tile-pattern-eten_drinken{ background-color: var(--sage); }
  .tile-pattern-werkwoorden{ background-color: var(--coral); }
  .tile-pattern-tijd_geld{ background-color: #7C5295; }
  .tile-pattern-surprise{ background-color: #C2578B; }
  .tile-pattern-wonen_huishouden{ background-color: #B8862E; }

  .header-pattern-basis{ background-color: var(--azulejo-deep); }
  .header-pattern-eten_drinken{ background-color: #1F3D2E; }
  .header-pattern-werkwoorden{ background-color: #4A2420; }
  .header-pattern-tijd_geld{ background-color: #3B2547; }
  .header-pattern-surprise{ background-color: #5A2740; }
  .header-pattern-wonen_huishouden{ background-color: #4A3418; }


  .package-featured-wrap{
    margin: 20px 16px 8px;
    background: white;
    border: 1.5px solid var(--azulejo);
    border-radius: var(--radius);
    padding: 14px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
  }
  .package-featured-icon{
    width:56px;
    height:56px;
    border-radius:14px;
    flex-shrink:0;
    box-shadow: 0 2px 6px rgba(18,49,71,0.15);
  }
  .package-featured-info{ flex:1; min-width:0; }
  .package-featured-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:17px;
    color: var(--ink);
  }
  .package-featured-progress{
    margin-top:4px;
    font-family:'JetBrains Mono', monospace;
  }
  .package-featured-progress .big-num{ font-size:20px; font-weight:700; color: var(--ink); }
  .package-featured-progress .slash-total{ font-size:13px; color: rgba(22,39,58,0.45); margin-left:2px; }
  .package-featured-btn{
    background: var(--azulejo-deep);
    color: var(--paper);
    border:none;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    padding:0;
  }
  .package-other-label{
    margin: 18px 20px 6px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color: rgba(22,39,58,0.4);
  }
  .package-row-list{
    margin: 0 16px 20px;
    background:white;
    border-radius: var(--radius);
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .package-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 12px 14px;
    cursor:pointer;
    border-bottom: 1px solid var(--line);
  }
  .package-row:last-child{ border-bottom:none; }
  .package-row:active{ background: var(--paper-dim); }
  .package-row-icon{
    width:40px;
    height:40px;
    border-radius:10px;
    flex-shrink:0;
  }
  .package-row-name{
    flex:1;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:15px;
    color: var(--ink);
  }
  .package-row-progress{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color: rgba(22,39,58,0.45);
  }

  .package-tile-grid{
    padding: 16px 16px 20px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }
  .package-tile{
    position:relative;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius);
    overflow:hidden;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:12px;
    color: var(--azulejo-deep);
    transition: transform .08s ease;
    box-shadow: 0 6px 16px rgba(18,49,71,0.18);
    border: 1px solid var(--line);
  }
  .package-tile:active{ transform: scale(0.97); }
  .package-tile::before{
    content:'';
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.45) 55%, transparent 85%);
  }
  .package-tile.active{
    box-shadow: 0 0 0 3px var(--gold), 0 6px 16px rgba(18,49,71,0.18);
  }
  .package-tile-badge{
    position:absolute;
    top:10px;
    right:10px;
    width:24px;
    height:24px;
    border-radius:50%;
    background: var(--gold);
    color: var(--azulejo-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
    z-index:2;
  }
  .package-tile-name{
    position:relative;
    z-index:1;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:16px;
    line-height:1.2;
    color: var(--azulejo-deep);
  }
  .package-tile-progress{
    position:relative;
    z-index:1;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    color: var(--azulejo);
    margin-top:4px;
  }

  /* ---- Total word tracker (signature element, bottom of quiz) ---- */
  .total-tracker{
    padding-top:4px;
  }
  .total-tracker-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    color: rgba(22,39,58,0.6);
    font-family:'JetBrains Mono', monospace;
    margin-bottom:6px;
  }
  .streak-badge{
    font-weight:700;
    color: var(--gold);
  }
  .total-tracker-bar{
    height:8px;
    border-radius:4px;
    background: rgba(22,39,58,0.09);
    overflow:hidden;
  }
  .total-tracker-fill{
    height:100%;
    background: linear-gradient(90deg, var(--gold), var(--azulejo));
    transition: width .4s ease;
  }

  /* ---- Main quiz area ---- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 22px 20px 28px;
    gap:14px;
  }
  .prompt-card{
    background: white;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px 20px;
    text-align:center;
    position:relative;
  }
  .prompt-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.4px;
    color: var(--azulejo);
    font-weight:600;
    margin-bottom:10px;
  }
  .prompt-word{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 30px;
    line-height:1.15;
    color: var(--ink);
    word-break: break-word;
  }
  .prompt-freq{
    margin-top:10px;
    font-size:11.5px;
    color: rgba(22,39,58,0.4);
    font-family:'JetBrains Mono', monospace;
  }

  .options{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }
  .option{
    background:white;
    border:1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px 12px;
    min-height: 60px;
    font-size:16px;
    font-weight:500;
    text-align:center;
    color: var(--ink);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition: border-color .12s ease, background .12s ease, transform .06s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .option:active{ transform: scale(0.985); }
  .option.correct{
    background: rgba(76,122,91,0.1);
    border-color: var(--sage);
    color: var(--sage);
  }
  .option.incorrect{
    background: rgba(190,68,56,0.08);
    border-color: var(--coral);
    color: var(--coral);
  }
  .option.answered:not(.correct):not(.incorrect){ opacity:0.5; }
  .option.answered{ cursor:pointer; }
  .option-mark{ font-size:15px; font-weight:700; }

  .feedback-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height: 30px;
    flex-wrap:wrap;
    gap:6px;
  }
  .feedback-text{
    font-size:14px;
    font-weight:600;
  }
  .feedback-text.ok{ color: var(--sage); }
  .feedback-text.no{ color: var(--coral); }
  .tap-hint{
    font-size:12.5px;
    color: rgba(22,39,58,0.45);
    font-style:italic;
  }

  /* ---- Stats view ---- */
  .stats-view{ padding: 20px; display:none; flex-direction:column; gap:16px; }
  .stats-view.visible{ display:flex; }
  .main.hidden{ display:none; }
  .stats-summary{
    background: var(--azulejo-deep);
    color: var(--paper);
    border-radius: var(--radius);
    padding: 18px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .stats-summary > div{ flex:1; text-align:center; }
  .stats-summary .big{
    font-family:'Fraunces', serif;
    font-size: 24px;
    font-weight:700;
  }
  .stats-summary .lbl{ font-size:11px; opacity:0.75; margin-top:2px;}
  .word-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  .word-row .wp{ flex:1; font-weight:600; font-size:14.5px; }
  .word-row .wn{ color: rgba(22,39,58,0.55); font-size:13px; flex:1; }
  .word-row .wb{
    width:70px; height:7px; border-radius:4px; background: rgba(22,39,58,0.09); overflow:hidden;
  }
  .word-row .wb .f{ height:100%; background: linear-gradient(90deg, var(--gold), var(--azulejo)); }
  .word-row .wpct{ width:38px; text-align:right; font-family:'JetBrains Mono', monospace; font-size:12px; color: rgba(22,39,58,0.6);}
  .section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    margin: 4px 0 0;
  }
  .reset-btn{
    margin-top:8px;
    background:none;
    border:1px solid var(--coral);
    color: var(--coral);
    padding:10px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .loading{
    display:flex; align-items:center; justify-content:center;
    height: 60vh;
    color: rgba(22,39,58,0.5);
    font-size:14px;
    font-family:'JetBrains Mono', monospace;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loadingScreen">Loading progress…</div>
</div>

  const idx = WORD_PACKAGES.findIndex(p => p.id === pkgId);

const POOL_SIZE = 15;
const MASTER_THRESHOLD = 0.75;
const MIN_ATTEMPTS_FOR_MASTERY = 3;
const HISTORY_WINDOW = 6;
const RESTING_BRING_BACK_CHANCE = 0.2;

let state = {
  selectedPackage: 'basis',
  pkgSort: 'diff-asc',
  fromLang: 'pt',
  toLang: 'nl',
  uiLang: 'en',
  uiLangChosen: false,
  packageProgress: {}, // packageId -> { 'pt-nl': {stats,pool}, 'nl-en': {stats,pool}, ... }
  streaks: {}          // packageId -> { current, longest }
};
let currentQuestion = null;
let lastShownId = null;
let currentView = 'package';
let settingsReturnView = 'package';
let answered = false;
let answeredAt = 0;
let answeredCorrectly = false;
const ADVANCE_DELAY_MS = 1000;

function directionKey(){ return state.fromLang + '-' + state.toLang; }

function currentPackage(){
  return WORD_PACKAGES.find(p => p.id === state.selectedPackage) || WORD_PACKAGES[0];
}
function currentWords(){ return currentPackage().words; }
function bankById(id){ return currentWords()[id]; }

function emptyProgress(){
  return { stats: {}, pool: [] };
}

function ensureStat(progress, id){
  if(!progress.stats[id]){
    progress.stats[id] = {
      id, correctTotal:0, incorrectTotal:0, history:[],
      everMastered:false, lastSeen:null, poolSince:null, restedSince:null, inPool:false,
      returning:false
    };
  }
  return progress.stats[id];
}

function pct(stat){
  if(!stat || stat.history.length === 0) return 0;
  const sum = stat.history.reduce((a,b)=>a+(b?1:0),0);
  return Math.round((sum/stat.history.length)*100);
}

function initPool(progress, words){
  for(let i=0;i<POOL_SIZE && i<words.length;i++){
    const s = ensureStat(progress, i);
    s.inPool = true;
    s.poolSince = Date.now();
    progress.pool.push(i);
  }
}

function ensureDirectionProgress(packageId, dirKey){
  if(!packageId) return null;
  if(!state.packageProgress[packageId]) state.packageProgress[packageId] = {};
  const pp = state.packageProgress[packageId];
  const words = (WORD_PACKAGES.find(p => p.id === packageId) || WORD_PACKAGES[0]).words;
  if(!pp[dirKey]) pp[dirKey] = emptyProgress();
  if(pp[dirKey].pool.length === 0) initPool(pp[dirKey], words);
  return pp[dirKey];
}

function ensurePackageProgress(packageId){
  ensureDirectionProgress(packageId, directionKey());
}

function ensureStreak(packageId, dirKey){
  if(!state.streaks[packageId]) state.streaks[packageId] = {};
  if(!state.streaks[packageId][dirKey]) state.streaks[packageId][dirKey] = { current:0, longest:0 };
  return state.streaks[packageId][dirKey];
}

function applyLoadedResult(res){
  if(res && res.value){
    const parsed = JSON.parse(res.value);
    if(parsed.packageProgress){
      state.selectedPackage = parsed.selectedPackage || null;
      state.packageProgress = parsed.packageProgress || {};
      state.streaks = parsed.streaks || {};
      if(parsed.fromLang && parsed.toLang){
        state.fromLang = parsed.fromLang;
        state.toLang = parsed.toLang;
      } else if(parsed.direction){
        const parts = parsed.direction.split('-');
        state.fromLang = parts[0] || 'pt';
        state.toLang = parts[1] || 'nl';
      }
      state.uiLang = parsed.uiLang || 'en';
      state.uiLangChosen = parsed.uiLangChosen !== undefined ? !!parsed.uiLangChosen : !!parsed.selectedPackage;
    } else if(parsed.progress){
      // migrate the old single-package save into the "basis" package
      state.selectedPackage = 'basis';
      state.packageProgress = { basis: parsed.progress };
      state.streaks = {};
      state.uiLangChosen = true;
      if(parsed.direction){
        const parts = parsed.direction.split('-');
        state.fromLang = parts[0] || 'pt';
        state.toLang = parts[1] || 'nl';
      }
    }
  }
  // res with no value simply means: nothing saved yet, genuinely first run
}

function loadState(){
  try{
    const raw = localStorage.getItem('palavra-progress');
    if(raw){
      applyLoadedResult({ value: raw });
    }
  }catch(e){ /* localStorage unavailable (e.g. private mode) - start fresh in memory */ }
}

function saveState(){
  try{
    localStorage.setItem('palavra-progress', JSON.stringify(state));
  }catch(e){ /* storage full or unavailable - fail silently, keep playing */ }
}

function currentProgress(){
  return ensureDirectionProgress(state.selectedPackage, directionKey());
}

function weightedPick(progress){
  const pool = progress.pool;
  const candidates = pool.filter(id => id !== lastShownId || pool.length === 1);
  const weights = candidates.map(id => (100 - pct(progress.stats[id])) + 8);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<candidates.length;i++){
    r -= weights[i];
    if(r <= 0) return candidates[i];
  }
  return candidates[candidates.length-1];
}

function onLangChanged(){
  lastShownId = null;
  buildQuestion();
  saveState();
  renderApp();
}

function buildQuestion(){
  const words = currentWords();
  const toKey = state.toLang, fromKey = state.fromLang;
  let wordId;

  if(currentPackage().isSurprise){
    // No pool, no mastery weighting: just a fresh random word each time,
    // avoiding repeating the same word twice in a row.
    do {
      wordId = Math.floor(Math.random() * words.length);
    } while(words.length > 1 && wordId === lastShownId);
  } else {
    const progress = currentProgress();
    wordId = weightedPick(progress);
  }
  lastShownId = wordId;
  const word = bankById(wordId);
  const correctText = word[toKey];
  const promptText = word[fromKey];

  const sameCatIds = [];
  const otherCatIds = [];
  for(let i=0;i<words.length;i++){
    if(i === wordId) continue;
    if(words[i][toKey] === correctText) continue;
    if(words[i].cat && words[i].cat === word.cat) sameCatIds.push(i);
    else otherCatIds.push(i);
  }
  shuffleArray(sameCatIds);
  shuffleArray(otherCatIds);
  // prefer distractors from the same category (similar/confusable words),
  // fall back to the rest of the bank only if a category is too small
  const orderedCandidates = [...sameCatIds, ...otherCatIds];
  const distractorTexts = [];
  const seen = new Set([correctText]);
  for(const id of orderedCandidates){
    const t = words[id][toKey];
    if(!seen.has(t)){ seen.add(t); distractorTexts.push(t); }
    if(distractorTexts.length === 3) break;
  }
  const options = shuffleArray([correctText, ...distractorTexts]);

  currentQuestion = { wordId, promptText, correctText, options };
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function handleOptionTap(chosenText, btnEl, allBtns){
  if(answered){
    // second tap anywhere on the options: move on to the next word.
    // wrong answers get a short lockout so the correction is actually seen;
    // correct answers can advance immediately.
    if(!answeredCorrectly && Date.now() - answeredAt < ADVANCE_DELAY_MS) return;
    buildQuestion();
    renderApp();
    return;
  }
  answered = true;
  answeredAt = Date.now();

  const isCorrect = chosenText === currentQuestion.correctText;
  answeredCorrectly = isCorrect;

  const streak = ensureStreak(state.selectedPackage, directionKey());
  if(isCorrect){
    streak.current++;
    if(streak.current > streak.longest) streak.longest = streak.current;
  } else {
    streak.current = 0;
  }

  allBtns.forEach(b=>{
    b.classList.add('answered');
    if(b.dataset.text === currentQuestion.correctText) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('incorrect');
  });

  if(currentPackage().isSurprise){
    // Surprise mode: no pool, no per-word mastery tracking - only the streak matters.
    saveState();
    renderFeedback(isCorrect, null);
    return;
  }

  const progress = currentProgress();
  const stat = ensureStat(progress, currentQuestion.wordId);
  const wasReturning = !!stat.returning;

  stat.history.push(isCorrect);
  if(stat.history.length > HISTORY_WINDOW) stat.history.shift();
  if(isCorrect) stat.correctTotal++; else stat.incorrectTotal++;
  stat.lastSeen = Date.now();

  const p = pct(stat);
  let masteredNow = false;
  if(wasReturning && stat.history.length === 1){
    // a returning (previously resting) word: right first time -> straight back out
    // of the pool; wrong first time -> it simply stays in the pool as normal
    if(isCorrect) masteredNow = true;
    else stat.returning = false;
  } else if(p >= Math.round(MASTER_THRESHOLD*100) && stat.history.length >= MIN_ATTEMPTS_FOR_MASTERY){
    masteredNow = true;
  }

  if(masteredNow){
    stat.everMastered = true;
    promoteWord(progress, currentQuestion.wordId);
  }

  saveState();
  renderFeedback(isCorrect, p);
}

function promoteWord(progress, id){
  const words = currentWords();
  const stat = progress.stats[id];
  stat.inPool = false;
  stat.restedSince = Date.now();
  progress.pool = progress.pool.filter(x => x !== id);

  const restingIds = Object.values(progress.stats)
    .filter(s => !s.inPool && s.restedSince && !progress.pool.includes(s.id) && s.id !== id)
    .sort((a,b)=>a.restedSince - b.restedSince);

  let freshId = null;
  for(let i=0;i<words.length;i++){
    if(!progress.stats[i]){ freshId = i; break; }
  }

  let nextId = null;
  let nextIsReturning = false;
  const bringBack = restingIds.length > 0 && Math.random() < RESTING_BRING_BACK_CHANCE;
  if(bringBack){
    nextId = restingIds[0].id;
    progress.stats[nextId].history = [];
    nextIsReturning = true;
  } else if(freshId !== null){
    nextId = freshId;
  } else if(restingIds.length > 0){
    nextId = restingIds[0].id;
    progress.stats[nextId].history = [];
    nextIsReturning = true;
  }

  if(nextId !== null){
    const s = ensureStat(progress, nextId);
    s.inPool = true;
    s.poolSince = Date.now();
    s.restedSince = null;
    s.returning = nextIsReturning;
    progress.pool.push(nextId);
  }
}

  document.getElementById('pkgToggle').onclick = () => {
    currentView = 'package';
    renderApp();
  };
  document.getElementById('settingsToggle').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('fromMenu').classList.remove('open');
    document.getElementById('toMenu').classList.remove('open');
    document.getElementById('settingsMenu').classList.toggle('open');
  };
  document.getElementById('settingsLangItem').onclick = () => {
    settingsReturnView = currentView;
    currentView = 'settings';
    renderApp();
  };
  document.getElementById('fromToggle').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('toMenu').classList.remove('open');
    document.getElementById('settingsMenu').classList.remove('open');
    document.getElementById('fromMenu').classList.toggle('open');
  };
  document.getElementById('toToggle').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('fromMenu').classList.remove('open');
    document.getElementById('settingsMenu').classList.remove('open');
    document.getElementById('toMenu').classList.toggle('open');
  };
  document.querySelectorAll('#fromMenu .lang-menu-item').forEach(item=>{
    item.onclick = () => {
      const val = item.dataset.lang;
      if(val === state.toLang) state.toLang = state.fromLang;
      state.fromLang = val;
      onLangChanged();
    };
  });
  document.querySelectorAll('#toMenu .lang-menu-item').forEach(item=>{
    item.onclick = () => {
      const val = item.dataset.lang;
      if(val === state.fromLang) state.fromLang = state.toLang;
      state.toLang = val;
      onLangChanged();
    };
  });
  document.getElementById('swapLangBtn').onclick = () => {
    const tmp = state.fromLang;
    state.fromLang = state.toLang;
    state.toLang = tmp;
    onLangChanged();
  };

  if(currentView === 'quiz'){
    if(!currentQuestion) buildQuestion();
    renderQuiz();
  } else {
    renderStats();
  }
}

// One shared language card list, used by both the onboarding and the settings view.
function renderLangCards(container, onActive){
  LANG_ORDER.forEach(l=>{
    const isActive = l === state.uiLang;
    const card = document.createElement('div');
    card.className = 'package-card' + (isActive ? ' active' : '');
    card.style.display = 'flex';
    card.style.alignItems = 'center';
    card.style.gap = '12px';
    card.innerHTML = `
      ${flagIcon(l, 28)}
      <div style="flex:1;">
        <div class="package-card-name">${LANGS[l].label}</div>
      </div>
      ${isActive ? `<div class="package-card-tag" style="margin-top:0">${t('active')}</div>` : ''}
    `;
    card.onclick = () => {
      if(isActive){ onActive(); return; }
      state.uiLang = l;
      saveState();
      renderApp();
    };
    container.appendChild(card);
  });
}

function sortLabelText(){
  const s = PKG_SORTS.find(x => x.key === (state.pkgSort || 'diff-asc')) || PKG_SORTS[0];
  return (s.label[state.uiLang] || s.label.nl) + ' ' + s.hint;
}

function renderPackageView(app){
  app.innerHTML = `
    <div class="header">

  function selectPackageAndGoToQuiz(pkgId){
    state.selectedPackage = pkgId;
    const pkg = WORD_PACKAGES.find(p => p.id === pkgId);
    if(!pkg || !pkg.isSurprise) ensurePackageProgress(pkgId);
    ensureStreak(pkgId, directionKey());
    lastShownId = null;
    currentQuestion = null;
    currentView = 'quiz';
    buildQuestion();
    saveState();
    renderApp();
  }

  const grandTotal = grandTotalWords();
  const grandMastered = grandTotalMastered();
  const grandStreak = grandTotalLongestStreak();
  const grandPct = grandTotal ? Math.round((grandMastered/grandTotal)*100) : 0;
  document.getElementById('grandTotalTracker').innerHTML = `
    <div class="total-tracker-row">
      <span>${grandMastered} / ${grandTotal}</span>
      <span class="streak-badge">&#128293; ${grandStreak}</span>
    </div>
    <div class="total-tracker-bar"><div class="total-tracker-fill" style="width:${grandPct}%"></div></div>
  `;

  const featuredPkg = WORD_PACKAGES.find(p => p.id === state.selectedPackage) || WORD_PACKAGES[0];
  const featuredWrap = document.getElementById('packageFeatured');
  const featTileColor = getComputedStyle(document.documentElement).getPropertyValue('--azulejo').trim() || '#2B5C7E';
  const featuredProgressHtml = featuredPkg.isSurprise
    ? `<span style="display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:1;color:rgba(22,39,58,0.45)"><span style="font-size:12px;line-height:1;color:#16273A">&#128293;</span><span style="line-height:1">${ensureStreak(featuredPkg.id, directionKey()).longest}</span></span>`
    : `<span style="font-size:13px;color:rgba(22,39,58,0.45)">${masteredCountFor(featuredPkg.id)}/${featuredPkg.words.length}</span>`;
  featuredWrap.innerHTML = `
    <div class="package-featured-icon ${tilePatternClass(featuredPkg.id)}" style="display:flex;align-items:center;justify-content:center;line-height:1;font-size:26px">${pkgIcon(featuredPkg.id)}</div>
    <div class="package-featured-info">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="package-featured-name">${packageName(featuredPkg)}</div>
        ${starsHtml(pkgDiff(featuredPkg.id), 15.5, featuredPkg.isSurprise ? '#C2578B' : '#B8862E')}
      </div>
      <div class="package-featured-progress" style="margin-top:5px">
        ${featuredProgressHtml}
      </div>
    </div>
    <button class="package-featured-btn" id="continueBtn" title="${t('continueBtn')}" style="pointer-events:none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <line x1="4" y1="12" x2="17" y2="12" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M12 5 L19 12 L12 19" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
  `;
  featuredWrap.onclick = () => selectPackageAndGoToQuiz(featuredPkg.id);

  const otherList = document.getElementById('packageOtherList');
  sortPackages(WORD_PACKAGES.filter(p => p.id !== featuredPkg.id)).forEach(pkg=>{
    const progressText = pkg.isSurprise
      ? `&#128293; ${ensureStreak(pkg.id, directionKey()).longest}`
      : `${masteredCountFor(pkg.id)}/${pkg.words.length}`;
    const row = document.createElement('div');
    row.className = 'package-row';
    row.innerHTML = `
      <div class="package-row-icon ${tilePatternClass(pkg.id)}" style="display:flex;align-items:center;justify-content:center;line-height:1;font-size:19px">${pkgIcon(pkg.id)}</div>
      <div style="flex:1;min-width:0">
        <div class="package-row-name">${packageName(pkg)}</div>
        <div style="margin-top:0">${starsHtml(pkgDiff(pkg.id), 12.5, pkg.isSurprise ? '#C2578B' : '#B8862E')}</div>
      </div>
      <div class="package-row-progress">${progressText}</div>
    `;
    row.onclick = () => selectPackageAndGoToQuiz(pkg.id);
    otherList.appendChild(row);
  });

  const sortBtn = document.getElementById('pkgSortBtn');
  const sortMenu = document.getElementById('pkgSortMenu');
  sortBtn.onclick = (e) => {
    e.stopPropagation();
    document.getElementById('fromMenu').classList.remove('open');
    document.getElementById('toMenu').classList.remove('open');
    document.getElementById('settingsMenu').classList.remove('open');
    sortMenu.classList.toggle('open');
  };
  sortMenu.querySelectorAll('[data-sort]').forEach(item=>{
    item.onclick = (e) => {
      e.stopPropagation();
      state.pkgSort = item.getAttribute('data-sort');
      saveState();
      renderApp();
    };
  });
  if(state.selectedPackage){
    document.getElementById('closePkg').onclick = () => {
      currentView = 'quiz';
      renderApp();
    };
  }
  document.getElementById('settingsToggle').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('fromMenu').classList.remove('open');
    document.getElementById('toMenu').classList.remove('open');
    document.getElementById('settingsMenu').classList.toggle('open');
  };
  document.getElementById('settingsLangItem').onclick = () => {
    settingsReturnView = currentView;
    currentView = 'settings';
    renderApp();
  };
  document.getElementById('fromToggle').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('toMenu').classList.remove('open');
    document.getElementById('settingsMenu').classList.remove('open');
    document.getElementById('fromMenu').classList.toggle('open');
  };
  document.getElementById('toToggle').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('fromMenu').classList.remove('open');
    document.getElementById('settingsMenu').classList.remove('open');
    document.getElementById('toMenu').classList.toggle('open');
  };
  document.querySelectorAll('#fromMenu .lang-menu-item').forEach(item=>{
    item.onclick = () => {
      const val = item.dataset.lang;
      if(val === state.toLang) state.toLang = state.fromLang;
      state.fromLang = val;
      saveState();
      renderApp();
    };
  });
  document.querySelectorAll('#toMenu .lang-menu-item').forEach(item=>{
    item.onclick = () => {
      const val = item.dataset.lang;
      if(val === state.fromLang) state.fromLang = state.toLang;
      state.toLang = val;
      saveState();
      renderApp();
    };
  });
  document.getElementById('swapLangBtn').onclick = () => {
    const tmp = state.fromLang;
    state.fromLang = state.toLang;
    state.toLang = tmp;
    saveState();
    renderApp();
  };
}

function renderTotalTracker(){
  const el = document.getElementById('totalTracker');
  if(!el) return;
  const streak = ensureStreak(state.selectedPackage, directionKey());

  if(currentPackage().isSurprise){
    el.innerHTML = `
      <div class="total-tracker-row" style="justify-content:center;">
        <span class="streak-badge">&#128293; ${streak.current}</span>
      </div>
    `;
    return;
  }

  const total = currentWords().length;
  const mastered = masteredCount();
  const pctMastered = total ? Math.round((mastered/total)*100) : 0;
  el.innerHTML = `
    <div class="total-tracker-row">
      <span>${mastered} / ${total}</span>
      <span class="streak-badge">&#128293; ${streak.longest}</span>
    </div>
    <div class="total-tracker-bar"><div class="total-tracker-fill" style="width:${pctMastered}%"></div></div>
  `;
}

function renderQuiz(){
  answered = false;
  const main = document.getElementById('mainView');
  main.innerHTML = `
    <div class="total-tracker" id="totalTracker"></div>
    <div class="prompt-card">
      <div class="prompt-label">${flagIcon(state.fromLang, 16)} ${LANGS[state.fromLang].label}</div>
      <div class="prompt-word">${currentQuestion.promptText}</div>
    </div>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback-row" id="feedbackRow"></div>
  `;
  const wrap = document.getElementById('optionsWrap');
  currentQuestion.options.forEach(text=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.text = text;
    btn.innerHTML = `<span>${text}</span>`;
    btn.onclick = () => handleOptionTap(text, btn, Array.from(wrap.children));
    wrap.appendChild(btn);
  });
  renderTotalTracker();
}

function renderFeedback(isCorrect, pctVal){
  const row = document.getElementById('feedbackRow');
  const suffix = pctVal === null || pctVal === undefined ? '' : ' — ' + pctVal + '%';
  row.innerHTML = `
    <span class="feedback-text ${isCorrect?'ok':'no'}">${(isCorrect ? t('correct') : t('incorrect')) + suffix}</span>
    <span class="tap-hint">${t('tapNext')}</span>
  `;
  renderTotalTracker();
}

function masteredCount(){
  const progress = currentProgress();
  return Object.values(progress.stats).filter(s=>s.everMastered).length;
}

function masteredCountFor(packageId){
  const progress = ensureDirectionProgress(packageId, directionKey());
  if(!progress) return 0;
  return Object.values(progress.stats).filter(s=>s.everMastered).length;
}

function grandTotalMastered(){
  return WORD_PACKAGES.filter(p => !p.isSurprise).reduce((sum, pkg) => sum + masteredCountFor(pkg.id), 0);
}

function grandTotalWords(){
  return WORD_PACKAGES.filter(p => !p.isSurprise).reduce((sum, pkg) => sum + pkg.words.length, 0);
}

function grandTotalLongestStreak(){
  return WORD_PACKAGES.filter(p => !p.isSurprise).reduce((max, pkg) => {
    const streak = ensureStreak(pkg.id, directionKey());
    return Math.max(max, streak.longest);
  }, 0);
}

function renderStats(){
  const progress = currentProgress();
  const streak = ensureStreak(state.selectedPackage, directionKey());
  const view = document.getElementById('statsView');
  const poolSorted = [...progress.pool].sort((a,b)=> pct(progress.stats[a]) - pct(progress.stats[b]));

  view.innerHTML = `
    <div class="stats-summary">
      <div>
        <div class="big">${masteredCount()}</div>
        <div class="lbl">${t('masteredOf')} ${currentWords().length}</div>
      </div>
      <div>
        <div class="big">${streak.longest}</div>
        <div class="lbl">${t('longestStreak')}</div>
      </div>
      <div style="text-align:center">
        <div class="big" style="display:flex; align-items:center; justify-content:center; gap:4px;">${flagIcon(state.fromLang, 20)}→${flagIcon(state.toLang, 20)}</div>
        <div class="lbl">${t('currentDirection')}</div>
      </div>
    </div>
    <div class="section-title">${t('activePool')}</div>
    <div id="poolList"></div>
    <button class="reset-btn" id="resetBtn">${t('resetProgress')}</button>
  `;
  const list = document.getElementById('poolList');
  poolSorted.forEach(id=>{
    const w = bankById(id);
    const p = pct(progress.stats[id]);
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <div class="wp">${w[state.fromLang]}</div>
      <div class="wn">${w[state.toLang]}</div>
      <div class="wb"><div class="f" style="width:${p}%"></div></div>
      <div class="wpct">${p}%</div>
    `;
    list.appendChild(row);
  });
  document.getElementById('resetBtn').onclick = () => {
    if(confirm(t('resetConfirm') + ' ' + LANGS[state.fromLang].label + ' → ' + LANGS[state.toLang].label + ' ' + t('resetConfirmEnd'))){
      const pp = state.packageProgress[state.selectedPackage];
      pp[directionKey()] = emptyProgress();
      initPool(pp[directionKey()], currentWords());
      lastShownId = null;
      currentQuestion = null;
      currentView = 'quiz';
      saveState();
      renderApp();
    }
  };
}

document.addEventListener('click', (e) => {
  if(!e.target.closest('.lang-dropdown')){
    document.querySelectorAll('.lang-menu.open').forEach(m => m.classList.remove('open'));
  }
});

async function boot(){
  await loadState();
  if(state.selectedPackage){
    ensurePackageProgress(state.selectedPackage);
    ensureStreak(state.selectedPackage, directionKey());
  }
  if(!state.uiLangChosen){
    currentView = 'langOnboarding';
  } else {
    currentView = state.selectedPackage ? 'quiz' : 'package';
    if(state.selectedPackage) buildQuestion();
  }
  renderApp();
}

boot();

if('serviceWorker' in navigator){
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.update().catch(() => {});
    }).catch(() => { /* offline support is optional; app still works without it */ });
  });
}
</script>
</body>
</html>
